<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main-container">
            <div class="difficulty">
                <h2>Difficulty Level</h2>
                <button id="easy">Easy</button>
                <button id="medium">Medium</button>
                <button id="hard">Hard</button>
            </div>
            <div class="main">
                <div class="info">
                    <p class="question-num-info">Question <span class="question-num">1</span> out of <span class="num-of-questions">5</span></p>
                    <p id="score-info">Score: <span id="score-num-info ">0</span></p>
                </div>
                <hr>
                <div class="questions-and-answers">
                    <div class="question">
                        <h2>What is <span id="number-one">1</span> <span id="operator">+</span> <span id="number-two">1</span>?</h2>
                    </div>
                    <div class="answers">
                        <div class="answer" id="answer-one"><h3>Answer 1</h3></div>
                        <div class="answer" id="answer-two"><h3>Answer 2</h3></div>
                        <div class="answer" id="answer-three"><h3>Answer 3</h3></div>
                        <div class="answer" id="answer-four"><h3>Answer 4</h3></div>                    
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
