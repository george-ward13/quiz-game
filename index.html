<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Math Quiz</h1>
        </header>
        <main>
            <div class="difficulty">
                <h2>Difficulty Level</h2>
                <button id="easy">Easy</button>
                <button id="medium">Medium</button>
                <button id="hard">Hard</button>
            </div>
            <div class="questions">
                <h2>Question</h2>
                <div class="buttons">
                    <button id="button-1">Pick</button>
                    <button id="button-2">Pick</button>
                    <button id="button-3">Pick</button>
                    <button id="button-4">Pick</button>
                </div>
                <div class="answers">
                    <h4 class="answer-1">Answer 1</h4>
                    <h4 class="answer-2">Answer 2</h4>
                    <h4 class="answer-3">Answer 3</h4>
                    <h4 class="answer-4">Answer 4</h4>
                </div>
            </div>
            <div class="score">
                <h2>Score:</h2>
                <h3 id="score">0</h3>
            </div>
        </main>
        <footer>
            <h6><a>George Ward's</a> Math Quiz 2026</h6>
        </footer>
    </body>
</html>
