<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="container start-screen-container active">
            <div class="start-screen">
                <div class="start-screen-header">
                    <div class="welcome-message"><h2>Hi! Welcome to the Maths Quiz Game by George Ward.</h2></div>
                    <hr>
                </div>
                <div class="start-screen-main">
                    <h3>Click here to start the game.</h3>
                    <div id="start-button"><h4>Start</h4></div>
                </div>
            </div>
        </div>
        <div class="container main-container">
            <div class="difficulty">
                <h2>Difficulty Level</h2>
                <button id="easy" class="difficulty-button">Easy</button>
                <button id="medium" class="difficulty-button">Medium</button>
                <button id="hard" class="difficulty-button">Hard</button>
            </div>
            <div class="main">
                <div class="info">
                    <h2 class="score-info bold">Score: <span id="score-num-info">0</span></h2>
                </div>
                <hr>
                <div class="questions-and-answers">
                    <div class="question">
                        <h2>What is <span id="number-one">1</span> <span id="operator">+</span> <span id="number-two">1</span>?</h2>
                    </div>
                    <div class="answers">
                        <div class="answer" id="answer-one"><h3>Answer 1</h3></div>
                        <div class="answer" id="answer-two"><h3>Answer 2</h3></div>
                        <div class="answer" id="answer-three"><h3>Answer 3</h3></div>
                        <div class="answer" id="answer-four"><h3>Answer 4</h3></div>                    
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
